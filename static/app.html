<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="9" y="9" width="7" height="20" rx="2"/>
        <rect x="18.5" y="9" width="7" height="26" rx="2"/>
        <rect x="28" y="9" width="7" height="14" rx="2"/>
      </svg>
      <span class="logo-text">Kanban</span>
    </div>
    <div class="topbar-right">
      <span class="user-chip">
        <span class="user-avatar" id="user-avatar"></span>
        <span id="user-name"></span>
      </span>
      <button class="btn btn-light" id="logout" type="button">Выйти</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <span class="eyebrow">Рабочая область</span>
      <h2>Проекты</h2>

      <form id="project-form" class="project-form">
        <input id="project-title" type="text" placeholder="Новый проект" maxlength="200" required>
        <button class="btn" type="submit" aria-label="Создать проект">+</button>
      </form>

      <p id="projects-state" class="state"></p>
      <ul id="projects-list" class="projects-list"></ul>
    </aside>

    <section class="board-area">
      <div class="board-head">
        <div class="board-head-text">
          <span class="eyebrow">Проект</span>
          <h2 id="board-title">Доска</h2>
          <p class="board-sub" id="board-sub"></p>
        </div>
        <div class="ring" id="ring" hidden>
          <span class="ring-value" id="ring-value">0%</span>
          <span class="ring-label">готово</span>
        </div>
      </div>

      <div id="board-tools" hidden>
        <div class="stats">
          <div class="stat">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">Всего</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-progress">0</span>
            <span class="stat-label">В процессе</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-done">0</span>
            <span class="stat-label">Готово</span>
          </div>
        </div>

        <div class="section-head">
          <div>
            <span class="eyebrow">Доска задач</span>
            <h3>Карточки</h3>
          </div>
          <button class="btn" id="add-card" type="button">+ Карточка</button>
        </div>
      </div>

      <p id="board-state" class="state"></p>
      <div id="board" class="board"></div>
    </section>
  </main>

  <dialog id="card-dialog" class="dialog">
    <form id="card-form">
      <span class="eyebrow">Карточка</span>
      <h3 id="dialog-title">Новая карточка</h3>

      <label for="card-title">Название</label>
      <input id="card-title" type="text" maxlength="200" required>

      <label for="card-description">Описание</label>
      <textarea id="card-description" rows="3"></textarea>

      <div class="form-row">
        <div>
          <label for="card-status">Колонка</label>
          <select id="card-status">
            <option value="todo">К работе</option>
            <option value="in_progress">В процессе</option>
            <option value="done">Готово</option>
          </select>
        </div>
        <div>
          <label for="card-priority">Приоритет</label>
          <select id="card-priority">
            <option value="1">Низкий</option>
            <option value="2" selected>Средний</option>
            <option value="3">Высокий</option>
          </select>
        </div>
      </div>

      <label for="card-due">Срок</label>
      <input id="card-due" type="date">

      <p id="card-error" class="error" hidden></p>

      <div class="dialog-actions">
        <button class="btn btn-light" id="card-cancel" type="button">Отмена</button>
        <button class="btn" id="card-save" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
