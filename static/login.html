<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Kanban</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-box">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="9" y="9" width="7" height="20" rx="2" fill="#fff" opacity="0.95"/>
        <rect x="18.5" y="9" width="7" height="26" rx="2" fill="#fff" opacity="0.75"/>
        <rect x="28" y="9" width="7" height="14" rx="2" fill="#fff" opacity="0.55"/>
      </svg>
      <span class="logo-text">Kanban</span>
    </div>

    <h1>С возвращением</h1>
    <p class="subtitle">Войдите, чтобы открыть свои проекты</p>

    <form id="auth-form" data-mode="login">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" placeholder="Ваш логин" autocomplete="username" required>

      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" placeholder="Ваш пароль" autocomplete="current-password" required>

      <p id="error" class="error" hidden></p>

      <button class="btn" type="submit">Войти</button>
    </form>

    <p class="auth-link">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
