<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="9" y="9" width="7" height="20" rx="2" fill="#fff" opacity="0.95"/>
        <rect x="18.5" y="9" width="7" height="26" rx="2" fill="#fff" opacity="0.75"/>
        <rect x="28" y="9" width="7" height="14" rx="2" fill="#fff" opacity="0.55"/>
      </svg>
      <span class="logo-text">Kanban</span>
    </div>
    <div class="topbar-right">
      <span class="user-chip">
        <span class="user-avatar" id="user-avatar"></span>
        <span id="user-name"></span>
      </span>
      <button class="btn btn-light" id="logout" type="button">Выйти</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Проекты</h2>

      <form id="project-form" class="project-form">
        <input id="project-title" type="text" placeholder="Новый проект" maxlength="200" required>
        <button class="btn" type="submit" aria-label="Создать проект">+</button>
      </form>

      <p id="projects-state" class="state"></p>
      <ul id="projects-list" class="projects-list"></ul>
    </aside>

    <section class="board-area">
      <div class="board-head">
        <h2 id="board-title">Доска</h2>
      </div>
      <p id="board-state" class="state"></p>
      <div id="board" class="board"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
